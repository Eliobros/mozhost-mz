name: Build MozHost Desktop

on:
  push:
    branches: [main, 'cursor/**']
  workflow_dispatch:

concurrency:
  group: build-mozhost-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend-desktop && npm install
      - run: cd frontend-desktop && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-deb
          path: |
            frontend-desktop/dist/*.AppImage
            frontend-desktop/dist/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend-desktop && npm install
      - run: cd frontend-desktop && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: frontend-desktop/dist/*.exe
