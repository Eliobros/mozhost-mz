version: '3.8'

services:
  mysql-shared:
    image: mysql:8.0
    container_name: mozhost_mysql_shared
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SuaSenhaRoot123}
      MYSQL_DATABASE: mozhost_main
      MYSQL_USER: ${MYSQL_USER:-mozhost}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-SuaSenhaUser456}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mozhost_network
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-SuaSenhaRoot123}"]
      timeout: 20s
      retries: 10
      interval: 10s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: mozhost_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql-shared
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SuaSenhaRoot123}
      UPLOAD_LIMIT: 50M
      MEMORY_LIMIT: 512M
    ports:
      - "8080:80"
    networks:
      - mozhost_network
    depends_on:
      mysql-shared:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local

networks:
  mozhost_network:
    driver: bridge
