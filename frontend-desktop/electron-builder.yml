appId: mz.co.mozhost
productName: MozHost
copyright: Copyright © 2026 MozHost
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - main
      - renderer/out
publish: null

win:
  target:
    - nsis
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Development
  maintainer: MozHost <mozhost@topaziocoin.online>
  synopsis: MozHost Desktop
  description: MozHost - Plataforma de Hospedagem de Containers e APIs
